name: Update wind forecast

on:
  schedule:
    # 5:00am, 1:00pm and 5:00pm Pacific Daylight Time (UTC-7). The midday run
    # was added because the original 5am/5pm-only schedule meant every
    # live-verification data point came from the two calmest hours of the
    # day — a poor sample for calibrating what a spot does at 1-2pm mid-
    # thermal. In winter (PST, UTC-8) these land an hour early (4am/12pm/4pm
    # local). Adjust to "0 13 * * *" / "0 20 * * *" / "0 1 * * *" around
    # November if you want it exact.
    #
    # These schedule runs can land 30-60+ minutes late (GitHub does not
    # guarantee cron timing), and Guillermo often posts his daily take well
    # after the 5am run. The "issues" trigger below is what actually gets a
    # freshly-posted take (or a wind report) onto the site quickly, rather
    # than waiting for the next scheduled slot — treat these cron times as
    # a safety net, not the primary mechanism.
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
    - cron: "0 0 * * *"
    # Backups, 90 minutes later (added Sep 28 2026): GitHub sometimes starts
    # a scheduled run hours late or skips it. A backup only does anything
    # if the site's snapshot is more than 2 hours old (see the "Skip if
    # fresh" step), so on a normal day it exits in a few seconds.
    - cron: "30 13 * * *"
    - cron: "30 21 * * *"
    - cron: "30 1 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab
  issues:
    # Fires the moment Guillermo posts or edits a "Daily take" or wind-report
    # issue, so the site updates within a minute or two instead of waiting
    # for the next scheduled run — this is what makes a morning take
    # actually show up in the morning. Also re-fires on "edited" so fixing a
    # typo (like a wrong date field) re-triggers a fresh build automatically.
    types: [opened, edited]

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    # This repo is public, so anyone can open an issue -- without this guard
    # a stranger filing an unrelated issue would trigger a pointless build.
    # Both the daily-take form and the report Worker create issues while
    # authenticated as ferreroforward, so this still covers everything real.
    if: github.event_name != 'issues' || github.event.issue.user.login == 'ferreroforward'
    steps:
      - uses: actions/checkout@v4

      - name: Skip if fresh (scheduled runs only)
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          age=$(node -e "const f=require('./data/forecast.json');console.log(Math.round((Date.now()-Date.parse(f.generated_at))/60000))" 2>/dev/null || echo 9999)
          echo "Snapshot is ${age} minutes old."
          if [ "$age" -lt 120 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Fresh enough, nothing to do."; fi

      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: "20"

      - name: Apply rider-feedback calibration
        if: steps.fresh.outputs.skip != 'true'
        run: node scripts/apply-feedback.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate forecast snapshot
        if: steps.fresh.outputs.skip != 'true'
        run: node scripts/generate.mjs

      - name: Commit and push if changed
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "wind-guru-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/forecast.json data/calibration-overrides.json data/live-verification-log.json
          git diff --staged --quiet && exit 0
          git commit -m "Update forecast snapshot [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "Failed to push after 5 attempts"
          exit 1
